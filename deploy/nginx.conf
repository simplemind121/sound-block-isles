# 放到 /etc/nginx/sites-available/sound-block-isles，再 ln -s 到 sites-enabled
# 把 server_name 改成你的域名（没有域名可以写服务器 IP，或用 _ ）
server {
    listen 80;
    server_name example.com;

    root /var/www/sound-block-isles;
    index index.html;

    gzip on;
    gzip_types application/javascript application/json text/css image/svg+xml;

    # 带哈希的 JS 文件可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 内容数据、录音清单、页面本身：每次都检查更新，改了 JSON 刷新就生效
    location ~* \.(json|html)$ {
        add_header Cache-Control "no-cache";
    }

    # 录音文件
    location /audio/ {
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
